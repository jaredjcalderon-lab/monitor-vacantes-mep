name: Monitor vacante Filosofía MEP

on:
  schedule:
    # Lunes a viernes, cada 30 min, de 6am a 6pm hora Costa Rica
    - cron: "*/30 6-18 * * 1-5"
      timezone: "America/Costa_Rica"
    # Sábado y domingo, cada 2 horas, de 6am a 6pm hora Costa Rica
    - cron: "0 6-18/2 * * 0,6"
      timezone: "America/Costa_Rica"
  workflow_dispatch: {}  # permite ejecutarlo manualmente para probar

permissions:
  contents: write  # necesario para poder guardar el estado (state.json)

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar estado (state.json) en el repo
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualiza estado [skip ci]"
          git push
